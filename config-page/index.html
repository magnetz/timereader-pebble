<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TimeReader — Library</title>
<style>
  :root {
    --bg: #f4f4f5; --fg: #18181b; --muted: #71717a; --card: #ffffff;
    --line: #d4d4d8; --accent: #2563eb; --danger: #b91c1c;
    --unread: #52525b; --started: #0e7490; --completed: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --card: #27272a;
      --line: #3f3f46; --accent: #60a5fa; --danger: #f87171;
      --unread: #a1a1aa; --started: #22d3ee; --completed: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 16px 0 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          margin-bottom: 8px; overflow: hidden; }
  .book-head { display: flex; align-items: center; gap: 8px; padding: 12px;
               cursor: pointer; user-select: none; }
  .book-head .title { flex: 1; font-weight: 600; }
  [data-book-row][data-color="unread"] .title { color: var(--unread); }
  [data-book-row][data-color="started"] .title { color: var(--started); }
  [data-book-row][data-color="completed"] .title { color: var(--completed); }
  .book-head .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .book-head .chev { color: var(--muted); transition: transform .15s; }
  [data-book-row].open .chev { transform: rotate(90deg); }

  .book-actions { display: none; flex-wrap: wrap; gap: 8px;
                  padding: 0 12px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  [data-book-row].open .book-actions { display: flex; }
  .book-actions button { flex: 1 1 auto; min-width: 84px; }

  button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.link { border: none; background: none; color: var(--accent); padding: 6px 8px; }

  form { display: grid; gap: 8px; margin: 8px 0; background: var(--card);
         border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--fg); }
  .form-buttons { display: flex; gap: 8px; }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions button { flex: 1; }
  [data-session-row] { display: flex; align-items: center; gap: 8px;
                       padding: 8px 0; border-bottom: 1px solid var(--line); }
  [data-session-row] span { flex: 1; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<h1 id="h-title">TimeReader — Library</h1>

<div id="book-list"></div>
<button id="add-book" class="link">+ Add book</button>

<form id="book-form" hidden>
  <label id="l-title">Title <input name="title" type="text" required /></label>
  <label id="l-series">Series <input name="series" type="text" /></label>
  <label id="l-author">Author <input name="author" type="text" /></label>
  <label id="l-total">Total pages <input name="total_pages" type="number" min="0" /></label>
  <label id="l-current">Current page <input name="current_page" type="number" min="0" /></label>
  <div class="form-buttons">
    <button type="submit" class="primary" id="book-form-submit">+ Add book</button>
    <button type="button" id="book-form-cancel">Cancel</button>
  </div>
</form>

<div id="sessions-panel" hidden>
  <h2><span id="h-sessions">Sessions</span> — <span id="sessions-book-title"></span></h2>
  <div class="list card" style="padding:12px"></div>
  <form id="session-form">
    <label id="l-start">Start page <input name="start_page" type="number" min="0" /></label>
    <label id="l-end">End page <input name="end_page" type="number" min="0" /></label>
    <label id="l-dur">Duration (min) <input name="duration_min" type="number" min="0" /></label>
    <div class="form-buttons">
      <button type="submit" class="primary" id="session-form-submit">+ Add session</button>
      <button type="button" id="session-form-close">Close</button>
    </div>
  </form>
  <p id="session-error" class="error"></p>
</div>

<div class="actions">
  <button id="save" class="primary">Save</button>
  <button id="cancel">Cancel</button>
</div>

<script>
(function () {
  var STRINGS = {
    en: {
      title: 'TimeReader — Library', addBook: '+ Add book', saveEdits: 'Save changes',
      cancel: 'Cancel', close: 'Close', save: 'Save',
      lTitle: 'Title', lSeries: 'Series', lAuthor: 'Author',
      lTotal: 'Total pages', lCurrent: 'Current page',
      sessions: 'Sessions', addSession: '+ Add session',
      lStart: 'Start page', lEnd: 'End page', lDur: 'Duration (min)',
      edit: 'Edit', del: 'Delete', fav: 'Favorite', unfav: 'Unfavorite',
      moveUp: 'Move up', moveDown: 'Move down', sessionsBtn: 'Sessions',
      errEnd: 'End page is lower than the start page',
      errDur: 'Duration cannot be negative',
      min: 'min',
    },
    it: {
      title: 'TimeReader — Libreria', addBook: '+ Aggiungi libro', saveEdits: 'Salva modifiche',
      cancel: 'Annulla', close: 'Chiudi', save: 'Salva',
      lTitle: 'Titolo', lSeries: 'Serie', lAuthor: 'Autore',
      lTotal: 'Pagine totali', lCurrent: 'Pagina attuale',
      sessions: 'Sessioni', addSession: '+ Aggiungi sessione',
      lStart: 'Pagina iniziale', lEnd: 'Pagina finale', lDur: 'Durata (min)',
      edit: 'Modifica', del: 'Elimina', fav: 'Preferito', unfav: 'Non preferito',
      moveUp: 'Su', moveDown: 'Giù', sessionsBtn: 'Sessioni',
      errEnd: 'La pagina finale è minore di quella iniziale',
      errDur: 'La durata non può essere negativa',
      min: 'min',
    },
  };
  var LANG = /^it\b/i.test(navigator.language || navigator.userLanguage || '') ? 'it' : 'en';
  function t(k) { return (STRINGS[LANG] && STRINGS[LANG][k]) || STRINGS.en[k] || k; }

  var state = { books: [], sessionsByBook: {}, globalPph: 0 };
  var ops = [];
  var editingId = null;
  var sessionsBookId = null;
  var openBookId = null;

  function decode(hash) {
    try { return JSON.parse(decodeURIComponent((hash || '').replace(/^#/, ''))); }
    catch (e) { return { books: [], sessionsByBook: {}, globalPph: 0 }; }
  }
  function escapeHtml(s) {
    return String(s).replace(/[<>&"']/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function field(form, name) { return form.querySelector('[name="' + name + '"]'); }
  function bookById(id) { return state.books.find(function (b) { return b.id === id; }); }
  function _mirror(id) { state.sessionsByBook[id] = state.sessionsByBook[id] || []; return state.sessionsByBook[id]; }

  function currentPage(book, sessions) {
    if (sessions && sessions.length) {
      return sessions.slice().sort(function (a, b) { return (a.created_at || 0) - (b.created_at || 0); }).pop().end_page;
    }
    return book.current_page || 0;
  }
  function colorState(book, sessions) {
    var cur = currentPage(book, sessions);
    if (book.total_pages > 0 && cur >= book.total_pages) return 'completed';
    if ((sessions && sessions.length) || (book.current_page || 0) > 0) return 'started';
    return 'unread';
  }
  function nextOrder() { return state.books.reduce(function (m, b) { return Math.max(m, b.order || 0); }, 0) + 1; }
  function sortedBooks() {
    return state.books.slice().sort(function (a, b) {
      if (!!a.favorite !== !!b.favorite) return a.favorite ? -1 : 1;
      return (a.order || 0) - (b.order || 0);
    });
  }

  function applyStaticText() {
    document.documentElement.lang = LANG;
    el('h-title').textContent = t('title');
    el('add-book').textContent = t('addBook');
    el('book-form-cancel').textContent = t('cancel');
    el('l-title').firstChild.textContent = t('lTitle') + ' ';
    el('l-series').firstChild.textContent = t('lSeries') + ' ';
    el('l-author').firstChild.textContent = t('lAuthor') + ' ';
    el('l-total').firstChild.textContent = t('lTotal') + ' ';
    el('l-current').firstChild.textContent = t('lCurrent') + ' ';
    el('h-sessions').textContent = t('sessions');
    el('session-form-submit').textContent = t('addSession');
    el('session-form-close').textContent = t('close');
    el('l-start').firstChild.textContent = t('lStart') + ' ';
    el('l-end').firstChild.textContent = t('lEnd') + ' ';
    el('l-dur').firstChild.textContent = t('lDur') + ' ';
    el('save').textContent = t('save');
    el('cancel').textContent = t('cancel');
  }

  function renderBooks() {
    var host = el('book-list');
    host.innerHTML = '';
    sortedBooks().forEach(function (b) {
      var sessions = state.sessionsByBook[b.id] || [];
      var card = document.createElement('div');
      card.className = 'card' + (openBookId === b.id ? ' open' : '');
      card.setAttribute('data-book-row', '');
      card.setAttribute('data-book-id', b.id);
      card.setAttribute('data-color', colorState(b, sessions));

      var head = document.createElement('div');
      head.className = 'book-head';
      head.innerHTML =
        (b.favorite ? '<span aria-hidden="true">★</span>' : '') +
        '<span class="title">' + escapeHtml(b.title) + '</span>' +
        '<span class="meta">' + currentPage(b, sessions) + '/' + (b.total_pages || '?') + '</span>' +
        '<span class="chev" aria-hidden="true">›</span>';
      head.addEventListener('click', function () {
        openBookId = (openBookId === b.id) ? null : b.id;
        renderBooks();
      });
      card.appendChild(head);

      var acts = document.createElement('div');
      acts.className = 'book-actions';
      [
        ['edit', function () { openForm(b.id); }],
        ['sessionsBtn', function () { openSessions(b.id); }],
        [b.favorite ? 'unfav' : 'fav', function () { toggleFavorite(b.id); }],
        ['moveUp', function () { move(b.id, -1); }],
        ['moveDown', function () { move(b.id, 1); }],
        ['del', function () { deleteBook(b.id); }],
      ].forEach(function (pair) {
        var btn = document.createElement('button');
        btn.textContent = t(pair[0]);
        if (pair[0] === 'del') btn.className = 'danger';
        btn.addEventListener('click', pair[1]);
        acts.appendChild(btn);
      });
      card.appendChild(acts);
      host.appendChild(card);
    });
  }

  function openForm(bookId) {
    editingId = bookId || null;
    var b = editingId ? bookById(editingId) : null;
    var f = el('book-form');
    field(f, 'title').value = b ? b.title : '';
    field(f, 'series').value = b ? (b.series || '') : '';
    field(f, 'author').value = b ? (b.author || '') : '';
    field(f, 'total_pages').value = b ? b.total_pages : '';
    field(f, 'current_page').value = b ? (b.current_page || 0) : 0;
    el('book-form-submit').textContent = editingId ? t('saveEdits') : t('addBook');
    f.hidden = false;
    if (f.scrollIntoView) f.scrollIntoView({ block: "nearest" });
  }
  function submitForm(fields) {
    if (editingId) {
      Object.assign(bookById(editingId), {
        title: fields.title, series: fields.series, author: fields.author,
        total_pages: +fields.total_pages || 0, current_page: +fields.current_page || 0,
      });
    } else {
      state.books.push({
        id: 'b_' + Math.random().toString(16).slice(2, 8), title: fields.title,
        series: fields.series || '', author: fields.author || '',
        total_pages: +fields.total_pages || 0, current_page: +fields.current_page || 0,
        favorite: false, order: nextOrder(), created_at: Math.floor(Date.now() / 1000),
      });
    }
    editingId = null;
    el('book-form').hidden = true;
    renderBooks();
  }
  function deleteBook(id) {
    (state.sessionsByBook[id] || []).forEach(function (s) { ops.push({ op: 'delete', id: s.id }); });
    state.books = state.books.filter(function (b) { return b.id !== id; });
    delete state.sessionsByBook[id];
    if (sessionsBookId === id) el('sessions-panel').hidden = true;
    if (openBookId === id) openBookId = null;
    renderBooks();
  }
  function toggleFavorite(id) {
    var b = bookById(id);
    b.favorite = !b.favorite;
    renderBooks();
  }
  function move(id, dir) {
    var ordered = sortedBooks();
    var i = ordered.findIndex(function (b) { return b.id === id; });
    var j = i + dir;
    if (j < 0 || j >= ordered.length) return;
    var a = ordered[i], b = ordered[j];
    var tmp = a.order; a.order = b.order; b.order = tmp;
    if (!!a.favorite !== !!b.favorite) { a.favorite = b.favorite; }
    renderBooks();
  }

  function validateSession(s) {
    if (s.end_page < s.start_page) return t('errEnd');
    if (s.duration_seconds < 0) return t('errDur');
    return null;
  }
  function openSessions(bookId) {
    sessionsBookId = bookId;
    var b = bookById(bookId);
    el('sessions-book-title').textContent = b ? b.title : '';
    el('session-error').textContent = '';
    renderSessions();
    el('sessions-panel').hidden = false;
    { var sp = el("sessions-panel"); if (sp.scrollIntoView) sp.scrollIntoView({ block: "nearest" }); }
  }
  function renderSessions() {
    var host = document.querySelector('#sessions-panel .list');
    host.innerHTML = '';
    (state.sessionsByBook[sessionsBookId] || []).forEach(function (s) {
      var r = document.createElement('div');
      r.setAttribute('data-session-row', s.id);
      r.innerHTML = '<span>p.' + s.start_page + '–' + s.end_page + '  ' +
        Math.round((s.duration_seconds || 0) / 60) + ' ' + t('min') + '</span>' +
        '<button class="danger" data-act="del">' + t('del') + '</button>';
      r.querySelector('button[data-act="del"]').addEventListener('click', function () { removeSession(s.id); });
      host.appendChild(r);
    });
  }
  function addSession(bookId, fields) {
    var s = {
      id: 's_' + Math.random().toString(16).slice(2, 8), book_id: bookId,
      start_page: +fields.start_page || 0, end_page: +fields.end_page || 0,
      duration_seconds: +fields.duration_seconds || 0, source: 'manual',
      created_at: Math.floor(Date.now() / 1000),
    };
    s.pages = s.end_page - s.start_page + 1;
    var err = validateSession(s);
    if (err) { el('session-error').textContent = err; return; }
    el('session-error').textContent = '';
    ops.push({ op: 'add', session: s });
    _mirror(bookId).push(s);
    renderSessions(); renderBooks();
  }
  function editSession(id, fields) {
    var s = _mirror(sessionsBookId).find(function (x) { return x.id === id; });
    if (!s) return;
    var next = Object.assign({}, s, {
      start_page: +fields.start_page, end_page: +fields.end_page,
      duration_seconds: +fields.duration_seconds,
    });
    next.pages = next.end_page - next.start_page + 1;
    var err = validateSession(next);
    if (err) { el('session-error').textContent = err; return; }
    Object.assign(s, next);
    ops.push({ op: 'update', session: s });
    renderSessions(); renderBooks();
  }
  function removeSession(id) {
    ops.push({ op: 'delete', id: id });
    state.sessionsByBook[sessionsBookId] = _mirror(sessionsBookId).filter(function (x) { return x.id !== id; });
    renderSessions(); renderBooks();
  }

  function render(s) { state = s || state; renderBooks(); }
  function buildResult() { return { books: sortedBooks(), sessionOps: ops }; }

  function closeWith(result) {
    var m = location.search.match(/[?&]return_to=([^&]+)/);
    var base = m ? decodeURIComponent(m[1]) : 'pebblejs://close#';
    location.href = base + encodeURIComponent(JSON.stringify(result));
  }

  window.__tr = {
    decode: decode, render: render, escapeHtml: escapeHtml, buildResult: buildResult,
    openForm: openForm, submitForm: submitForm, deleteBook: deleteBook,
    toggleFavorite: toggleFavorite, move: move,
    openSessions: openSessions, addSession: addSession, editSession: editSession, removeSession: removeSession,
    _state: function () { return state; }, _ops: function () { return ops; }, _lang: function () { return LANG; },
  };

  applyStaticText();
  render(decode(location.hash));

  el('add-book').addEventListener('click', function () { openForm(); });
  el('book-form-cancel').addEventListener('click', function () {
    el('book-form').hidden = true; editingId = null;
  });
  el('book-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    submitForm({
      title: field(f, 'title').value, series: field(f, 'series').value, author: field(f, 'author').value,
      total_pages: field(f, 'total_pages').value, current_page: field(f, 'current_page').value,
    });
    f.reset();
  });
  el('session-form-close').addEventListener('click', function () {
    el('sessions-panel').hidden = true;
  });
  el('session-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    addSession(sessionsBookId, {
      start_page: field(f, 'start_page').value, end_page: field(f, 'end_page').value,
      duration_seconds: (+field(f, 'duration_min').value || 0) * 60,
    });
    f.reset();
  });
  el('save').addEventListener('click', function () { closeWith(buildResult()); });
  el('cancel').addEventListener('click', function () { closeWith({ cancelled: true }); });
})();
</script>
</body>
</html>
